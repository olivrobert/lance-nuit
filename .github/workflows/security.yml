name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # Full history: a secret that was committed and then removed is still
        # in the pack, so scanning only the tip would miss it.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan working tree
        # Catches anything untracked-then-added in the same run, and files the
        # history scan skips.
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  semgrep:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install --quiet semgrep==1.174.0

      - name: Scan
        # Only ERROR rules gate the build. WARNING rules are informational and
        # reported by the next step.
        run: >-
          semgrep scan
          --config .semgrep.yml
          --severity ERROR
          --error
          --metrics off
          --quiet

      - name: Report informational findings
        if: always()
        run: >-
          semgrep scan
          --config .semgrep.yml
          --severity WARNING
          --metrics off
          --no-error
