name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Node runs tools such as ESLint, dependency-cruiser and tsc through
      # their shebangs. npm packs and verifies consumer installations, including
      # extension imports under Node. dependency-cruiser requires Node 22.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The runtime. Everything that executes the runner — the test suite, the
      # standalone smoke test, the production install check — runs on Bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      # The dashboard's `app.js` and `app.css` are bundled from
      # `src/modules/ui/app/` and are not committed, so they have to exist before
      # anything asserts that the server serves them.
      - name: Build the dashboard front end
        run: bun run ui:build

      - name: Run Bun tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check public language
        run: bun run language:check

      - name: Typecheck
        run: bun run typecheck

      - name: Check DSL API reference is up to date
        run: |
          bun run docs:dsl
          git diff --exit-code docs/DSL-API.md

      - name: Audit npm pack contents
        run: bun run pack:audit

      - name: Run standalone smoke test
        run: bun run smoke:standalone

      - name: Verify clean production tarball installation
        run: bun run verify:production
